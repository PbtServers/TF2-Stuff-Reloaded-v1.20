plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.24' // Usamos una versión fija para evitar problemas de resolución
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = "1.20.1-1.7.3a"
group = "rafradek.tf2weapons"
archivesBaseName = "TF2-Stuff-Reloaded-v1.20"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    // Mappings actualizados para 1.20.1
    mappings channel: 'official', version: '1.20.1'
    
    // TODO 1.20.1 port: re-enable once the legacy 1.12.2 AT entries are remapped.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'tf2weapons'
            mods {
                tf2weapons {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                tf2weapons {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "mixins.tf2stuff-reloaded.refmap.json"
    config "mixins.tf2stuff-reloaded.json"
}

repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://www.cursemaven.com' }
	maven {
        // Repositorio oficial de JEI (mezz)
        name = "ProgWML6 maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    
    // Usando el maven oficial es mucho más estable
    //compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:15.2.0.27")
    //runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:15.2.0.27")
    
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

sourceSets.main.java {
    // TODO 1.20.1 port: re-enable the legacy client and mixin sources once the
    // server/common layer compiles and the renderer/GUI APIs are migrated.
    exclude 'rafradek/tf2weapons/arena/**'
    exclude 'rafradek/tf2weapons/block/**'
    exclude 'rafradek/tf2weapons/client/**'
    exclude 'rafradek/tf2weapons/TF2weapons.java'
    exclude 'rafradek/tf2weapons/TF2EventsCommon.java'
    exclude 'rafradek/tf2weapons/TF2PlayerCapability.java'
    exclude 'rafradek/tf2weapons/common/TF2Achievements.java'
    exclude 'rafradek/tf2weapons/common/TF2Attribute.java'
    exclude 'rafradek/tf2weapons/common/WeaponsCapability.java'
    exclude 'rafradek/tf2weapons/contract/**'
    exclude 'rafradek/tf2weapons/command/**'
    exclude 'rafradek/tf2weapons/entity/ai/**'
    exclude 'rafradek/tf2weapons/entity/boss/**'
    exclude 'rafradek/tf2weapons/entity/building/**'
    exclude 'rafradek/tf2weapons/entity/EntityArmorStand.java'
    exclude 'rafradek/tf2weapons/entity/EntityDummy.java'
    exclude 'rafradek/tf2weapons/entity/EntityLightDynamic.java'
    exclude 'rafradek/tf2weapons/entity/EntityPickup.java'
    exclude 'rafradek/tf2weapons/entity/EntityStatue.java'
    exclude 'rafradek/tf2weapons/entity/EntityTarget.java'
    exclude 'rafradek/tf2weapons/entity/IEntityTF2.java'
    exclude 'rafradek/tf2weapons/entity/mercenary/**'
    exclude 'rafradek/tf2weapons/entity/projectile/**'
    exclude 'rafradek/tf2weapons/inventory/**'
    exclude 'rafradek/tf2weapons/item/**'
    exclude 'rafradek/tf2weapons/item/ItemCrate.java'
    exclude 'rafradek/tf2weapons/item/ItemFromData.java'
    exclude 'rafradek/tf2weapons/item/crafting/**'
    exclude 'rafradek/tf2weapons/jei/**'
    exclude 'rafradek/tf2weapons/loot/**'
    exclude 'rafradek/tf2weapons/message/**'
    exclude 'rafradek/tf2weapons/mixin/**'
    exclude 'rafradek/tf2weapons/registry/TF2BlockEntities.java'
    exclude 'rafradek/tf2weapons/tileentity/**'
    exclude 'rafradek/tf2weapons/util/WeaponData.java'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: "1.20.1",
            version: project.version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : "TF2weapons",
                "Specification-Vendor"    : "rafradek",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : "rafradek",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
